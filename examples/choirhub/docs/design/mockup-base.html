<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: SCREEN NAME</title>
<!--
  Base for every mockup. Copy to docs/products/<slug>/mockups/<screen>.html.
  1. The token values below are the ones in docs/design/system.md (filled 2026-09-16; keep the names).
  2. The two faces are Fraunces (display) and Inter (body), as the design system names.
  3. Put the screen inside a .phone. Real copy, real-looking data, no lorem ipsum.
  4. States: one .phone per state in this file, or a -empty / -error file.
  This file is a picture that happens to be HTML. It is never imported into the app.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap">
<style>
  :root {
    --bg: #FBF7F2; --surface: #FFFFFF; --ink: #221C18; --ink-muted: #6B615A;
    --line: #E5DCD2; --line-strong: #9C8C7C; --accent: #A8442A; --accent-soft: #F6E7DF;
    --on-accent: #FFFFFF; --success: #2F6B4F; --warning: #8A5A0B; --danger: #B4241F;
    --page: #E9E3DA; --frame: #2A211C;
    --display: "Fraunces", Georgia, serif; --body: "Inter", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 12px; --radius-sheet: 24px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16120F; --surface: #1F1A16; --ink: #F3EDE7; --ink-muted: #A79B92;
      --line: #332B25; --line-strong: #7A6C5F; --accent: #E08060; --accent-soft: #3A251C;
      --on-accent: #1F1A16; --success: #5FBF92; --warning: #D9A441; --danger: #F08279;
      --page: #0C0A08; --frame: #000000;
    }
  }
  * { box-sizing: border-box; }
  input, textarea, button, select { font-family: var(--body); }
  ::placeholder { color: var(--ink-muted); opacity: .65; }
  body { margin: 0; background: var(--page); font-family: var(--body); color: var(--ink);
    display: flex; flex-wrap: wrap; gap: 32px; padding: 32px; justify-content: center; align-items: flex-start; }
  .phone { width: 390px; min-height: 780px; background: var(--bg); border-radius: 36px; border: 8px solid var(--frame);
    overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .phone .bar { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-muted); }
  .screen { flex: 1; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
  .label { font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .08em; }
  h1 { font-family: var(--display); font-size: 28px; margin: 0; line-height: 1.15; font-weight: 600; }
  h2 { font-family: var(--body); font-size: 16px; margin: 0; font-weight: 600; line-height: 1.35; }
  h3 { font-family: var(--body); font-size: 13px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); }
  p { margin: 0; line-height: 1.5; font-size: 15px; }
  a { color: var(--accent); }
  .muted { color: var(--ink-muted); }
  .small { font-size: 13px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s4);
    border-radius: var(--radius); font: 600 15px var(--body); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.wide { width: 100%; }
  .btn:disabled, .btn.disabled { opacity: .45; }
  .row { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 var(--s4); }
  .card.pad { padding: var(--s4); display: grid; gap: var(--s3); }
  .field { display: grid; gap: var(--s1); }
  .field label { font-size: 13px; font-weight: 600; }
  .field input, .field textarea { min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius);
    padding: var(--s3); font: 15px/1.4 var(--body); background: var(--surface); color: var(--ink); width: 100%; }
  .field .help { font-size: 12px; color: var(--ink-muted); }
  .field.error input, .field.error textarea { border-color: var(--danger); border-width: 2px; }
  .field.error .help { color: var(--danger); font-weight: 600; }
  .empty { text-align: center; padding: var(--s8) var(--s4); display: grid; gap: var(--s3); justify-items: center; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .pill.ok { background: transparent; color: var(--success); border: 1px solid var(--success); }
  .pill.no { background: transparent; color: var(--ink-muted); border: 1px solid var(--line-strong); }
  .pill.wait { background: transparent; color: var(--warning); border: 1px solid var(--warning); }
  .confirm { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: var(--s4); display: grid; gap: var(--s3); }
  .confirm .actions { display: flex; gap: var(--s2); } .confirm .actions .btn { flex: 1; }
  .caption { width: 100%; text-align: center; font-size: 13px; color: var(--ink-muted); font-family: var(--body); }
  /* Reply control: the singer's one tap. Two halves, 44px+, never a dropdown. */
  .reply { display: flex; gap: var(--s2); }
  .reply .btn { flex: 1; min-height: 52px; }
  .reply .btn.chosen { background: var(--success); border-color: var(--success); color: var(--on-accent); }
  .reply .btn.chosen.out { background: var(--surface); border-color: var(--ink-muted); color: var(--ink); border-width: 2px; }
  /* Section counts: chips, never names. */
  .counts { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
  .counts .total { font-family: var(--display); font-size: 24px; font-weight: 600; }
  .chip { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
  .sec { width: 26px; height: 26px; flex: none; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  /* Paste box: the AI capture step. */
  .paste { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--s4); display: grid; gap: var(--s3); }
  .paste textarea { min-height: 96px; width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: var(--s3); font: 15px/1.4 var(--body); background: var(--surface); color: var(--ink); }
  /* Status group: the conductor's three groups, fixed order. */
  .group { display: grid; gap: var(--s2); }
  .group .head { display: flex; align-items: baseline; justify-content: space-between; }
  /* Read-only banner. */
  .banner { background: var(--accent-soft); border-radius: var(--radius); padding: var(--s3) var(--s4); font-size: 14px; line-height: 1.4; }
  /* Bottom navigation, conductor only. */
  .tabs { display: flex; border-top: 1px solid var(--line); background: var(--surface); }
  .tabs a { flex: 1; text-align: center; padding: var(--s3) 0 var(--s4); font-size: 12px; font-weight: 600; color: var(--ink-muted); text-decoration: none; }
  .tabs a.on { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
  /* Loading skeleton and thinking state. */
  .sk { background: var(--line); border-radius: 6px; height: 12px; animation: pulse 1.4s ease-in-out infinite; }
  .sk.t { height: 20px; width: 60%; }
  @keyframes pulse { 0%, 100% { opacity: .5 } 50% { opacity: .9 } }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
  /* Sheet: contact details, conductor only. */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: var(--s6) var(--s4) var(--s6); display: grid; gap: var(--s3); }
  .scrim { position: absolute; inset: 0; background: rgba(34,28,24,.45); }
  .push { margin-top: auto; display: grid; gap: var(--s2); }
  .big { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.2; }
  .center { text-align: center; }
  .idx { max-width: 760px; width: 100%; } /* the mockups index page, not a phone */
  .choice { display: flex; gap: var(--s2); }
  .choice .btn { flex: 1; padding: 0 var(--s2); font-size: 14px; }
  .choice .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .err { color: var(--danger); font-weight: 600; font-size: 14px; line-height: 1.4; }
  .ok-note { color: var(--success); font-weight: 600; font-size: 14px; line-height: 1.4; }
  /* Mockup annotation only. The frame label sits OUTSIDE the phone; it is never app chrome. */
  .fr { display: grid; gap: var(--s3); justify-items: center; margin: 0; }
  .fr figcaption { font: 600 13px var(--body); color: var(--ink-muted); text-align: center; max-width: 390px; }
</style>
</head>
<body>
  <figure class="fr"><figcaption>State name, written outside the frame so it is never mistaken for app chrome</figcaption>
  <div class="phone">
    <div class="bar">9:41</div>
    <div class="screen">
      <span class="label">Screen name</span>
      <h1>Title in the choir's words</h1>
      <p class="muted">One line that says what this screen is for.</p>
      <div class="card">
        <div class="row"><span class="sec">S</span><div class="grow"><h2>List row title</h2><p class="muted small">Secondary line</p></div><span class="pill ok">Coming</span></div>
        <div class="row"><span class="sec">T</span><div class="grow"><h2>Another row</h2><p class="muted small">Secondary line</p></div><span class="pill wait">No answer</span></div>
      </div>
      <div class="counts"><span class="total">18 coming</span><span class="chip">S 5</span><span class="chip">A 4</span><span class="chip">T 4</span><span class="chip">B 5</span></div>
      <div class="field"><label for="x">Field label</label><input id="x" value="Real-looking value"><span class="help">Helper text</span></div>
      <div class="confirm"><strong>Here is what I understood</strong><p class="muted small">What the model read, shown before anything is saved.</p><div class="actions"><button class="btn primary">Create rehearsal</button><button class="btn">Edit</button></div></div>
      <div class="push"><button class="btn primary wide">Primary action</button><button class="btn wide">Secondary action</button></div>
    </div>
    <nav class="tabs"><a href="#" class="on">Rehearsals</a><a href="#">Singers</a></nav>
  </div></figure>
  <figure class="fr"><figcaption>Empty</figcaption>
  <div class="phone">
    <div class="bar">9:41</div>
    <div class="screen">
      <span class="label">Screen name · empty</span>
      <h1>Title in the choir's words</h1>
      <div class="empty"><h2>Nothing here yet</h2><p class="muted">One sentence that teaches what to do first.</p><button class="btn primary">Primary action</button></div>
    </div>
  </div></figure>
  <p class="caption">Left: the screen with data, counts and a confirmation card. Right: the empty state. Add a phone per further state.</p>
</body>
</html>
