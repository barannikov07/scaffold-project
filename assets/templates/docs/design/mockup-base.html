<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: SCREEN NAME</title>
<!--
  Base for every mockup. Copy to docs/products/<slug>/mockups/<screen>.html.
  1. The token values below are replaced once with the ones in docs/design/system.md (keep the names).
  2. Load the two faces the design system names.
  3. Put the screen inside a .phone. Real copy, real-looking data, no lorem ipsum.
  4. One <figure> per state; the state's name goes in the <figcaption> OUTSIDE the phone, never inside it.
  5. Add a component here only if two screens need it; then add it to system.md too.
  This file is a picture that happens to be HTML. It is never imported into the app.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DISPLAY+FACE:wght@700&family=BODY+FACE:wght@400;600&display=swap">
<style>
  :root {
    --bg: #F4F6FA; --surface: #FFFFFF; --ink: #161C26; --ink-muted: #6B7385; --line: #D9DEE7; --line-strong: #9AA3B5;
    --accent: #2B4FD8; --accent-soft: #E3E9FC; --on-accent: #FFFFFF; --success: #0E8A7B; --warning: #B7791F; --danger: #C0392B;
    --display: "DISPLAY FACE", system-ui, sans-serif; --body: "BODY FACE", system-ui, sans-serif;
    --radius: 8px; --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
  }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F141C; --surface: #161C26; --ink: #EDF1F7; --ink-muted: #9AA3B5; --line: #2A3342; --line-strong: #4A5568; --accent: #7C95F2; --accent-soft: #1B2547; --on-accent: #0F141C; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9ECF2; font-family: var(--body); color: var(--ink); display: flex; flex-wrap: wrap; gap: 32px; padding: 32px; justify-content: center; align-items: flex-start; }
  input, textarea, select, button { font: inherit; color: inherit; }
  ::placeholder { color: var(--ink-muted); opacity: 1; }
  figure.fr { margin: 0; display: grid; gap: var(--s3); justify-items: center; }
  figure.fr figcaption { font-size: 13px; color: #6B7385; text-align: center; max-width: 390px; }
  .phone { width: 390px; min-height: 780px; background: var(--bg); border-radius: 36px; border: 8px solid #1B2230; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .phone .bar { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-muted); }
  .top { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4) var(--s2); min-height: 44px; }
  .top .back { width: 44px; height: 44px; display: grid; place-items: center; margin-left: -12px; color: var(--ink); }
  .top h1 { flex: 1; }
  .screen { flex: 1; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
  h1 { font-family: var(--display); font-size: 24px; margin: 0; line-height: 1.15; }
  h2 { font-family: var(--display); font-size: 18px; margin: 0; }
  h3 { font-size: 13px; margin: 0; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 0; line-height: 1.5; font-size: 15px; }
  .muted { color: var(--ink-muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 var(--s4); border-radius: var(--radius); font-weight: 600; font-size: 15px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--accent); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 var(--s4); }
  .card.pad { padding: var(--s4); }
  .row { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .field { display: grid; gap: var(--s1); } .field label { font-size: 13px; font-weight: 600; }
  .field input, .field textarea, .field select { min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: var(--s3); background: var(--surface); }
  .field textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .field .help { font-size: 12px; color: var(--ink-muted); } .field.error .help { color: var(--danger); } .field.error input, .field.error textarea { border-color: var(--danger); }
  .empty { text-align: center; padding: var(--s12) var(--s4); display: grid; gap: var(--s3); justify-items: center; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .pill.ok { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .pill.warn { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
  .chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; border: 0; background: var(--surface); font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .confirm { background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--s4); display: grid; gap: var(--s3); }
  .confirm .actions { display: flex; gap: var(--s2); } .confirm .actions .btn { flex: 1; }
  .banner { border-radius: var(--radius); padding: var(--s3) var(--s4); font-size: 14px; background: var(--accent-soft); }
  .banner.ok { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
  .banner.error { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, var(--surface) 50%, var(--line) 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  .tabs { display: flex; border-top: 1px solid var(--line); background: var(--surface); }
  .tabs a { flex: 1; min-height: 56px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--ink-muted); text-decoration: none; }
  .tabs a[aria-current="page"] { color: var(--accent); }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding: var(--s4); display: grid; gap: var(--s3); }
  .toast { position: absolute; left: var(--s4); right: var(--s4); bottom: var(--s6); background: var(--ink); color: var(--bg); padding: var(--s3) var(--s4); border-radius: var(--radius); font-size: 14px; }
  .spacer { margin-top: auto; }
</style>
</head>
<body>
  <figure class="fr">
    <div class="phone">
      <div class="bar">9:41</div>
      <div class="top"><a class="back" href="#" aria-label="Back">‹</a><h1>Title in the owner's words</h1></div>
      <div class="screen">
        <p class="muted">One line that says what this screen is for.</p>
        <div class="chips"><span class="pill ok">12 coming</span><span class="pill">3 not coming</span><span class="pill warn">4 no answer</span></div>
        <div class="card">
          <div class="row"><div class="grow"><h2>List row title</h2><p class="muted">Secondary line</p></div><span class="pill">Status</span></div>
          <div class="row"><div class="grow"><h2>Another row</h2><p class="muted">Secondary line</p></div></div>
        </div>
        <div class="field"><label>Field label</label><input value="Real-looking value"><span class="help">Helper text</span></div>
        <div class="seg"><button aria-pressed="true">Coming</button><button>Not coming</button></div>
        <div class="confirm"><strong>Here is what I understood</strong><p class="muted">The AI's reading of the input, shown before anything is saved.</p><div class="actions"><button class="btn primary">Confirm</button><button class="btn">Edit</button></div></div>
        <div class="spacer" style="display:grid; gap: var(--s2)"><button class="btn primary">Primary action</button><button class="btn">Secondary action</button></div>
      </div>
      <nav class="tabs"><a href="#" aria-current="page">Rehearsals</a><a href="#">Singers</a></nav>
    </div>
    <figcaption>Screen name · with data. Top bar, count chips, list, field, segmented control, confirmation card, bottom tabs.</figcaption>
  </figure>
  <figure class="fr">
    <div class="phone">
      <div class="bar">9:41</div>
      <div class="top"><h1>Title in the owner's words</h1></div>
      <div class="screen">
        <div class="empty"><h2>Nothing here yet</h2><p class="muted">One sentence that teaches what to do first.</p><button class="btn primary">Primary action</button></div>
      </div>
    </div>
    <figcaption>Screen name · empty state.</figcaption>
  </figure>
  <figure class="fr">
    <div class="phone">
      <div class="bar">9:41</div>
      <div class="top"><h1>Title in the owner's words</h1></div>
      <div class="screen">
        <div class="banner error">Could not save. Check your connection and try again.</div>
        <div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:85%"></div><div class="skeleton" style="width:40%"></div>
        <div class="field"><label>Paste the message</label><textarea placeholder="Paste the WhatsApp message here"></textarea><span class="help">We read the date, place and songs from it.</span></div>
      </div>
      <div class="scrim"><div class="sheet"><h2>Sheet title</h2><p class="muted">A short choice or confirmation that does not need a whole screen.</p><button class="btn primary">Do the thing</button><button class="btn quiet">Cancel</button></div></div>
      <div class="toast">Saved. 18 coming now.</div>
    </div>
    <figcaption>Screen name · error banner, loading skeleton, textarea, bottom sheet, toast. Use one at a time in a real screen.</figcaption>
  </figure>
</body>
</html>
